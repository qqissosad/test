<title>CDGA 单选题练习 · DAMA 题库第一部分（500 题）</title>
<style>
  :root{
    --bg:#f4f6fa;
    --panel:#ffffff;
    --ink:#1c2430;
    --ink-2:#5a6577;
    --ink-3:#8b95a6;
    --line:#e3e8f0;
    --brand:#2f6bff;
    --brand-soft:#eaf0ff;
    --ok:#17915c;
    --ok-soft:#e6f6ee;
    --no:#d63b3b;
    --no-soft:#fdeceb;
    --warn:#b7791f;
    --warn-soft:#fdf3e2;
    --radius:14px;
    --shadow:0 1px 2px rgba(22,31,48,.05), 0 8px 24px rgba(22,31,48,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    font-size:15px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px 60px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .hd{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .hd h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;}
  .hd .sub{color:var(--ink-3);font-size:12.5px;margin-left:2px;}
  .hd-stats{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .stat{
    background:var(--brand-soft);color:var(--brand);
    border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;
    white-space:nowrap;
  }
  .stat.ok{background:var(--ok-soft);color:var(--ok);}
  .stat.no{background:var(--no-soft);color:var(--no);}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:6px 14px;border-radius:9px;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:#c9d3e4;background:#fbfcfe;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:#2559e0;border-color:#2559e0;}
  .btn.ghost{border-color:transparent;color:var(--ink-2);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .bar{height:3px;background:#eaeef5;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#4b83ff,#2f6bff);width:0;transition:width .25s ease;}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:1fr 300px;gap:20px;margin-top:22px;align-items:start;}
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}

  /* ---------- question ---------- */
  .q-head{display:flex;align-items:center;gap:10px;padding:16px 22px 0;flex-wrap:wrap;}
  .q-idx{font-size:13px;color:var(--ink-2);font-weight:600;}
  .chip{font-size:11.5px;padding:2px 9px;border-radius:6px;font-weight:600;letter-spacing:.3px;}
  .chip.zhen{background:#fdf3e2;color:var(--warn);}
  .chip.fang{background:#eef1f7;color:var(--ink-2);}
  .chip.state{margin-left:auto;}
  .chip.s-un{background:#f1f3f7;color:var(--ink-3);}
  .chip.s-r{background:var(--ok-soft);color:var(--ok);}
  .chip.s-w{background:var(--no-soft);color:var(--no);}
  .q-body{padding:12px 22px 4px;}
  .q-stem{font-size:17px;line-height:1.75;font-weight:550;color:#16202e;margin:0 0 18px;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    border:1.5px solid var(--line);background:#fff;border-radius:11px;
    padding:12px 14px;cursor:pointer;transition:.15s;text-align:left;
    font:inherit;color:inherit;width:100%;
  }
  .opt:hover:not(.locked){border-color:#a9bde8;background:#fbfcff;}
  .opt .k{
    flex:0 0 26px;height:26px;border-radius:7px;background:#f1f4f9;color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;
  }
  .opt .t{flex:1;font-size:15px;line-height:1.7;}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft);}
  .opt.sel .k{background:var(--brand);color:#fff;}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);}
  .opt.right .k{background:var(--ok);color:#fff;}
  .opt.wrong{border-color:var(--no);background:var(--no-soft);}
  .opt.wrong .k{background:var(--no);color:#fff;}
  .opt.locked{cursor:default;}
  .opt .mark{margin-left:auto;font-size:12.5px;font-weight:700;flex:0 0 auto;padding-top:3px;}
  .opt.right .mark{color:var(--ok);}
  .opt.wrong .mark{color:var(--no);}

  /* ---------- result ---------- */
  .res{
    margin:16px 0 0;padding:13px 16px;border-radius:11px;font-size:14.5px;
    display:flex;gap:10px;align-items:flex-start;line-height:1.7;
  }
  .res.r{background:var(--ok-soft);color:#0f6b45;border:1px solid #c8e8d8;}
  .res.w{background:var(--no-soft);color:#a52c2c;border:1px solid #f3cfcd;}
  .res b{font-weight:750;}
  .res .anscode{
    display:inline-block;min-width:22px;text-align:center;font-weight:800;
    padding:0 6px;border-radius:5px;background:rgba(255,255,255,.75);
  }
  .exp{margin-top:10px;padding:13px 16px;background:#f7f9fc;border:1px solid var(--line);border-radius:11px;color:var(--ink-2);font-size:14px;}
  .exp .lb{font-weight:700;color:var(--ink);margin-right:6px;}

  .ctrl{display:flex;gap:10px;align-items:center;padding:18px 22px 20px;flex-wrap:wrap;}
  .ctrl .btn{padding:8px 18px;font-size:14px;}
  .hint{margin-left:auto;color:var(--ink-3);font-size:12px;}

  /* ---------- side ---------- */
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:72px;}
  @media (max-width:900px){ .side{position:static;} }
  .panel-t{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:1px;text-transform:uppercase;padding:14px 16px 0;}
  .filters{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap;}
  .filters .btn{padding:4px 11px;font-size:12.5px;}
  .filters .btn.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .nav-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:12px 16px 16px;max-height:340px;overflow:auto;}
  .cell{
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    border-radius:6px;background:#f1f4f9;color:var(--ink-2);
    font-size:11.5px;cursor:pointer;border:1px solid transparent;transition:.12s;font-weight:600;
  }
  .cell:hover{border-color:var(--brand);}
  .cell.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);}
  .cell.r{background:var(--ok-soft);color:var(--ok);}
  .cell.w{background:var(--no-soft);color:var(--no);}
  .scorebox{padding:14px 16px 16px;}
  .big{font-size:30px;font-weight:750;letter-spacing:-.5px;}
  .big small{font-size:15px;font-weight:600;color:var(--ink-3);}
  .rows{margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);}
  .rows div{display:flex;justify-content:space-between;}
  .rows b{font-weight:700;color:var(--ink);}
  .toggle{display:flex;align-items:center;gap:8px;padding:0 16px 14px;font-size:13px;color:var(--ink-2);}
  .toggle input{accent-color:var(--brand);width:15px;height:15px;}

  /* ---------- modal ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(20,26,38,.45);z-index:60;
    display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;
  }
  .mask.on{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;box-shadow:0 24px 60px rgba(16,24,40,.25);overflow:hidden;}
  .modal h2{margin:0;padding:20px 24px 0;font-size:19px;}
  .modal .m-body{padding:14px 24px 6px;color:var(--ink-2);font-size:14.5px;}
  .scoreline{display:flex;align-items:center;gap:18px;padding:6px 0 10px;}
  .ring{
    width:96px;height:96px;border-radius:50%;flex:0 0 96px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-weight:800;color:var(--brand);
    background:conic-gradient(var(--brand) var(--p,0deg), #eaeef5 0deg);
  }
  .ring i{
    width:78px;height:78px;border-radius:50%;background:#fff;display:flex;
    flex-direction:column;align-items:center;justify-content:center;font-style:normal;
  }
  .ring i span{font-size:22px;line-height:1.1;}
  .ring i em{font-size:11px;color:var(--ink-3);font-style:normal;font-weight:600;}
  .wronglist{margin-top:12px;max-height:220px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;}
  .wronglist span{background:var(--no-soft);color:var(--no);border-radius:6px;padding:2px 9px;font-size:12.5px;cursor:pointer;font-weight:600;}
  .wronglist span:hover{text-decoration:underline;}
  .modal .m-foot{display:flex;gap:10px;padding:16px 24px 20px;flex-wrap:wrap;}
  .empty{color:var(--ink-3);font-size:13.5px;padding:6px 0 2px;}
  kbd{
    font-family:inherit;font-size:11.5px;background:#f1f4f9;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink-2);
  }
</style>
</head>

const QUESTIONS = [{"n":1,"tag":"真题","q":"数据质量管理的一个原则是将改进重点集中在组织及其客户最重要的数据上，即关键数据。以下哪项不是关键数据的评估要求？","o":[{"k":"A","t":"监管报告和财务报告"},{"k":"B","t":"差异化竞争战略"},{"k":"C","t":"持续经营"},{"k":"D","t":"部门政策"}],"a":"D","e":"关键数据评估应围绕监管/财务/竞争战略/持续经营，部门政策不属于关键数据评估要求。P350"},{"n":2,"tag":"真题","q":"请从下列选项中选择关于元数据管理工作度量指标描述正确的选项。","o":[{"k":"A","t":"元数据存储库完整性"},{"k":"B","t":"元数据存储库的性能"},{"k":"C","t":"元数据的备份"},{"k":"D","t":"元数据技术选型"}],"a":"A","e":"元数据存储库完整性是元数据管理工作的度量指标之一。P343"},{"n":3,"tag":"真题","q":"在数据安全活动中，首先应当解决的是识别数据安全需求。下列哪项不是安全需求之一？","o":[{"k":"A","t":"全面了解组织的业务需求"},{"k":"B","t":"通过分析业务规则和流程确定安全接触点"},{"k":"C","t":"充分了解组织所在地对数据的法律法规限制"},{"k":"D","t":"系统软件对数据安全的要求低于业务需求的安全要求"}],"a":"D","e":"系统软件与业务需求的安全要求都需关注，不能低于。P185"},{"n":4,"tag":"真题","q":"以下哪项属于数据管理成熟度四级的特征？","o":[{"k":"A","t":"有一致的工具和角色定义来支持流程执行"},{"k":"B","t":"引入了可扩展的数据管理流程并将其制度化"},{"k":"C","t":"设置了数据管理的绩效指标，能预测结果并管理与数据相关的风险"},{"k":"D","t":"数据管理实践得到优化，采用流程自动化和技术变更管理"}],"a":"C","e":"成熟度四级（已管理级）特征包含设置绩效指标、预测结果、管理风险。P419"},{"n":5,"tag":"真题","q":"数据治理需要业务和技术共同驱动，请选择不属于业务驱动因素的选项。","o":[{"k":"A","t":"法规遵从性"},{"k":"B","t":"高级分析师、数据科学家的发展"},{"k":"C","t":"信息系统开发"},{"k":"D","t":"减少风险或改进流程"}],"a":"C","e":"业务驱动因素含法规遵从、人才发展、减风险/改进流程；信息系统开发属技术侧。P45"},{"n":6,"tag":"真题","q":"请从下列描述中选择最能描述文件和记录之间关系的选项。","o":[{"k":"A","t":"文档是记录的子集"},{"k":"B","t":"文件和记录无关"},{"k":"C","t":"文件和记录是同一回事"},{"k":"D","t":"记录是文档的子集"}],"a":"D","e":"记录是具有证据价值的文档，记录是文档的子集"},{"n":7,"tag":"真题","q":"非关系型数据库通常被称为NoSQL 数据库。请从下列选项中选择不属于NoSQL的数据库类型。","o":[{"k":"A","t":"空间数据库"},{"k":"B","t":"键值对"},{"k":"C","t":"列式数据库"},{"k":"D","t":"多维数据库"}],"a":"D","e":"NoSQL 含键值、列式、文档、图、空间等；多维数据库不属于典型NoSQL。P99-100"},{"n":8,"tag":"真题","q":"请从下列选项中选择不属于影响组织开展数据管理能力成熟度评估因素的选项。","o":[{"k":"A","t":"法律法规的限制"},{"k":"B","t":"组织认识到改进应从评估当前状态开始"},{"k":"C","t":"出于规划与合规性目的需进行成熟度评估"},{"k":"D","t":"技术进步提供了管理和使用数据的新方法"}],"a":"A","e":"法律法规限制是必须考虑的评估因素，并非\"不属于\"。P416"},{"n":9,"tag":"真题","q":"根据DMBOK2，在实施数据治理时注重数据标准建设，以下关于数据标准的描述哪个不正确？","o":[{"k":"A","t":"数据标准必须有效沟通、监控并定期审查更新，须有强制手段可按标准测量"},{"k":"B","t":"数据标准 架"},{"k":"D","t":"数据库选型"}],"a":"D","e":"数据库选型不是治理启动工作的内容。P53-55"},{"n":19,"tag":"真题","q":"关于数据和信息，下列哪项是正确的描述？","o":[{"k":"A","t":"数据被称为信息的原材料，信息是在上下文语境中的数据"},{"k":"B","t":"数据不需要被管理，信息需要被管理"},{"k":"C","t":"数据和信息有严格区别不容混淆"},{"k":"D","t":"两术语在DAMA 体系中不可互换"}],"a":"A","e":"数据是信息的原材料，信息是在上下文语境中的数据；二者在DMBOK 可互换使用"},{"n":20,"tag":"真题","q":"DAMA 数据管理框架核心包括三部分内容（三张图），请从下列选项中选择不属于该框架的选项。","o":[{"k":"A","t":"语境关系图"},{"k":"B","t":"六边形图"},{"k":"C","t":"车轮图"},{"k":"D","t":"数据架构图"}],"a":"D","e":"三张图为车轮图、六边形图、语境关系图"},{"n":21,"tag":"真题","q":"DAMA 提出了数据管理的12 项原则，下列哪项不是该12 原则之一？","o":[{"k":"A","t":"数据管理需要规划"},{"k":"B","t":"数据是资产同时也是风险"},{"k":"C","t":"数据管理必须确定数据的权属"},{"k":"D","t":"数据作为资产可以用经济术语表达"}],"a":"C","e":"12 原则含规划、资产属性、可用经济术语表达等；\"必须确定数据权属\"表述非原文原则"},{"n":22,"tag":"真题","q":"数据管理的原则有很多，下列选项不正确的是？","o":[{"k":"A","t":"数据管理需要企业级视野"},{"k":"B","t":"数据管理是一把手工程，需领导者承担责任"},{"k":"C","t":"数据管理应由IT 部门主导、业务部门配合"},{"k":"D","t":"数据管理包括管理与数据相关的风险"}],"a":"C","e":"数据管理需业务与IT 共担，不能仅由IT 主导"},{"n":23,"tag":"真题","q":"数据价值的评估可以有多种方法，下列正确的是？","o":[{"k":"A","t":"获取数据的成本，但无需考虑存储成本"},{"k":"B","t":"储存数据所需数据库和服务器价格"},{"k":"C","t":"数据丢失对组织的影响"},{"k":"D","t":"数据潜在销售价格减去获取成本"}],"a":"C","e":"数据丢失对组织的影响是衡量数据价值的重要维度"},{"n":24,"tag":"真题","q":"DAMA 环境因素六边形图包含（）。","o":[{"k":"A","t":"角色和职责、运营、分析、工具"},{"k":"B","t":"人员、技术、工具、方法"},{"k":"C","t":"角色和职责、技术、工具、方法"},{"k":"D","t":"组织和文化、人员、分析、过程"}],"a":"C","e":"六边形图含角色职责、活动、工具、组织和文化、方法、交付成果"},{"n":25,"tag":"真题","q":"数据与信息的区别，下列说法正确的是？","o":[{"k":"A","t":"数据是对其所代表对象的解释"},{"k":"B","t":"信息是更高层次的知识"},{"k":"C","t":"这两个术语可以互换使用"},{"k":"D","t":"信息需要管理，数据自然产生可不需管理"}],"a":"C","e":"DMBOK 中数据和信息两术语可互换使用"},{"n":26,"tag":"真题","q":"战略一致性模型从宏观到微观，下列哪项不属于模型里的架构？","o":[{"k":"A","t":"IT 战略"},{"k":"B","t":"业务战略"},{"k":"C","t":"信息系统"},{"k":"D","t":"组织和发展"}],"a":"D","e":"战略一致性模型含业务、IT 战略、组织流程、信息系统。P15"},{"n":27,"tag":"真题","q":"请从下列实体中选择不能独立存在的实体。","o":[{"k":"A","t":"客户"},{"k":"B","t":"账户"},{"k":"C","t":"商品"},{"k":"D","t":"职业"}],"a":"B","e":"账户依赖客户等实体存在，不能独立存在"},{"n":28,"tag":"真题","q":"数据管理必须平衡战略和运 /* ---------------- state ---------------- */
const TOTAL = QUESTIONS.length;
const KEY = 'dama-cdga-part1-progress-v1';
let answers = new Array(TOTAL).fill(null);   // 每题已选选项 'A'..'E'
let submitted = new Array(TOTAL).fill(false); // 每题是否已提交
let cur = 0;
let filter = 'all';
let autoExp = false;

const $ = id => document.getElementById(id);

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({a:answers,s:submitted,cur:cur})); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const d = JSON.parse(raw);
    if(Array.isArray(d.a) && d.a.length===TOTAL){ answers = d.a; }
    if(Array.isArray(d.s) && d.s.length===TOTAL){ submitted = d.s; }
    if(Number.isInteger(d.cur) && d.cur>=0 && d.cur<TOTAL){ cur = d.cur; }
  }catch(e){}
}

/* ---------------- render ---------------- */
function visibleList(){
  if(filter==='all') return QUESTIONS.map((q,i)=>i);
  if(filter==='undone') return QUESTIONS.map((q,i)=>i).filter(i=>!submitted[i]);
  return QUESTIONS.map((q,i)=>i).filter(i=>submitted[i] && answers[i]!==QUESTIONS[i].a);
}

function renderNav(){
  const list = visibleList();
  const set = new Set(list);
  $('navGrid').innerHTML = QUESTIONS.map((q,i)=>{
    if(!set.has(i)) return '';
    let cls='cell';
    if(i===cur) cls+=' cur';
    if(submitted[i]) cls += (answers[i]===q.a) ? ' r' : ' w';
    return `<div class="${cls}" data-i="${i}" title="第${q.n}题">${q.n}</div>`;
  }).join('');
  if(!list.length) $('navGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">暂无符合条件的题目</div>';
}

function renderStats(){
  const done = submitted.filter(Boolean).length;
  const right = QUESTIONS.filter((q,i)=>submitted[i] && answers[i]===q.a).length;
  const wrong = done - right;
  const left = TOTAL - done;
  const acc = done ? Math.round(right/done*100) : null;

  $('sTotal').textContent = '共 '+TOTAL+' 题';
  $('sDone').textContent = '已答 '+done;
  $('sRight').textContent = '正确 '+right;
  $('sWrong').textContent = '错误 '+wrong;

  $('accRate').innerHTML = (acc===null?'--':acc+'%') + '<small> 正确率</small>';
  $('rDone').textContent = done+' / '+TOTAL;
  $('rRight').textContent = right;
  $('rWrong').textContent = wrong;
  $('rLeft').textContent = left;
  $('bar').style.width = (done/TOTAL*100)+'%';
}

function renderQuestion(){
  const q = QUESTIONS[cur];
  const done = submitted[cur];

  $('qIdx').textContent = `第 ${q.n} 题 / 共 ${TOTAL} 题`;
  $('qTag').textContent = q.tag || '单选';
  $('qTag').className = 'chip ' + (q.tag==='真题' ? 'zhen' : 'fang');

  const st = $('qState');
  if(!done){ st.textContent='未作答'; st.className='chip state s-un'; }
  else if(answers[cur]===q.a){ st.textContent='回答正确'; st.className='chip state s-r'; }
  else { st.textContent='回答错误'; st.className='chip state s-w'; }

  $('qStem').textContent = q.n + '. ' + q.q;

  $('qOpts').innerHTML = q.o.map(o=>{
    const isSel = answers[cur]===o.k;
    const isAns = o.k===q.a;
    let cls='opt', mark='';
    if(done){
      cls+=' locked';
      if(isAns){ cls+=' right'; mark='<span class="mark">正确答案</span>'; }
      else if(isSel){ cls+=' wrong'; mark='<span class="mark">你的选择</span>'; }
    } else if(isSel){ cls+=' sel'; }
    return `<button type="button" class="${cls}" data-k="${o.k}">
              <span class="k">${o.k}</span><span class="t">${esc(o.t)}</span>${mark}
            </button>`;
  }).join('');

  // 结果反馈
  const box = $('qRes');
  if(!done){ box.innerHTML=''; }
  else{
    const ok = answers[cur]===q.a;
    box.innerHTML = `
      <div class="res ${ok?'r':'w'}">
        <span>${ok
          ? '<b>✓ 回答正确。</b> 你的答案 <span class="anscode">'+answers[cur]+'</span> 与标准答案一致。'
          : '<b>✗ 回答错误。</b> 你的答案 <span class="anscode">'+answers[cur]+'</span>，正确答案是 <span class="anscode">'+q.a+'</span>。'}</span>
      </div>
      ${ (!ok || autoExp) && q.e ? `<div class="exp"><span class="lb">解析</span>${esc(q.e)}</div>` : '' }
      ${ (q.e && !autoExp && ok) ? `<div style="margin-top:8px"><button class="btn" id="btnExp" style="font-size:12.5px;padding:4px 12px">查看解析</button></div>` : '' }
    `;
    const be = $('btnExp');
    if(be) be.onclick = ()=>{ box.innerHTML += `<div class="exp"><span class="lb">解析</span>${esc(q.e)}</div>`; be.remove(); };
  }

  $('btnPrev').disabled = (cur===0);
  $('btnNext').disabled = (cur===TOTAL-1);

  renderNav(); renderStats();
}

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---------------- actions ---------------- */
function go(i){
  if(i<0||i>=TOTAL) return;
  cur = i;
  renderQuestion();
  const y = $('qcard').getBoundingClientRect().top + window.scrollY - 76;
  window.scrollTo({top:Math.max(y,0), behavior:'smooth'});
  save();
}
function pick(k){
  if(submitted[cur]) return;            // 已判题的题目不可修改
  answers[cur] = k;
  submitted[cur] = true;                // 点击选项即判题
  renderQuestion();
  save();
  // 答对：短暂展示正确反馈（约 500ms）后自动进入下一题；答错：停留，由用户手动翻页
  if(k === QUESTIONS[cur].a && cur < TOTAL-1){
    const at = cur;
    setTimeout(()=>{ if(cur === at) go(at+1); }, 500);
  }
}
function resetAll(){
  if(!confirm('确定清空所有作答记录并重新开始吗？')) return;
  answers = new Array(TOTAL).fill(null);
  submitted = new Array(TOTAL).fill(false);
  filter='all';
  document.querySelectorAll('.filters .btn').forEach(b=>b.classList.toggle('on', b.dataset.f==='all'));
  go(0);
}

/* ---------------- events ---------------- */
$('qOpts').addEventListener('click', e=>{
  const b = e.target.closest('.opt'); if(!b) return;
  pick(b.dataset.k);
});
$('btnPrev').onclick = ()=> go(cur-1);
$('btnNext').onclick = ()=> go(cur+1);
$('btnReset').onclick = resetAll;
$('btnReset2').onclick = ()=>{ closeModal(); resetAll(); };
$('chkAutoExp').onchange = e=>{ autoExp = e.target.checked; renderQuestion(); };

$('navGrid').addEventListener('click', e=>{
  const c = e.target.closest('.cell'); if(!c) return;
  go(+c.dataset.i);
});
document.querySelectorAll('.filters .btn').forEach(b=>{
  b.onclick = ()=>{
    filter = b.dataset.f;
    document.querySelectorAll('.filters .btn').forEach(x=>x.classList.toggle('on', x===b));
    renderNav();
  };
});

document.addEventListener('keydown', e=>{
  if($('mask').classList.contains('on')) return;
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toUpperCase();
  if(/^[A-E]$/.test(k)) { pick(k); e.preventDefault(); return; }
  if(e.key==='Enter'){ go(cur+1); e.preventDefault(); return; }
  if(e.key==='ArrowLeft'){ go(cur-1); e.preventDefault(); }
  if(e.key==='ArrowRight'){ go(cur+1); e.preventDefault(); }
});

/* ---------------- 交卷 ---------------- */
function openModal(){
  const done = submitted.filter(Boolean).length;
  const wrongIdx = QUESTIONS.map((q,i)=>i).filter(i=>submitted[i] && answers[i]!==QUESTIONS[i].a);
  const right = done - wrongIdx.length;
  const acc = done ? Math.round(right/done*100) : 0;

  $('mTotal').textContent = TOTAL;
  $('mDone').textContent = done;
  $('mRight').textContent = right;
  $('mWrong').textContent = wrongIdx.length;
  $('mLeft').textContent = TOTAL - done;
  $('ringScore').textContent = acc + '%';
  $('ring').style.setProperty('--p', (acc*3.6)+'deg');

  const list = $('mWrongList');
  list.innerHTML = wrongIdx.map(i=>`<span data-i="${i}">第 ${QUESTIONS[i].n} 题</span>`).join('');
  const noAns = TOTAL - done;
  let title = '错题题号';
  if(noAns) title = `错题题号（另有 ${noAns} 题未作答）`;
  $('mWrongTitle').textContent = wrongIdx.length ? title : '错题题号';
  $('mEmpty').style.display = (wrongIdx.length===0 && noAns===0) ? 'block' : 'none';
  $('mWrongTitle').style.display = wrongIdx.length ? 'block' : 'none';
  $('btnReviewWrong').disabled = wrongIdx.length===0;

  $('mask').classList.add('on');
}
function closeModal(){ $('mask').classList.remove('on'); }

$('btnSubmitAll').onclick = openModal;
$('btnSheet').onclick = openModal;
$('btnCloseModal').onclick = closeModal;
$('mask').addEventListener('click', e=>{ if(e.target===$('mask')) closeModal(); });
$('mWrongList').addEventListener('click', e=>{
  const s = e.target.closest('span'); if(!s) return;
  closeModal(); go(+s.dataset.i);
});
$('btnReviewWrong').onclick = ()=>{
  closeModal(); filter='wrong';
  document.querySelectorAll('.filters .btn').forEach(x=>x.classList.toggle('on', x.dataset.f==='wrong'));
  const list = visibleList();
  go(list.length ? list[0] : cur);
};

/* ---------------- boot ---------------- */
load();
renderQuestion();
</script>
</body>
</html>
